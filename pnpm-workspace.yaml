# pnpm workspace configuration
packages:
  - '.'
  - 'packages/*'
allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.30.0'

# Force patched transitive deps (Dependabot / CVE floors)
# pnpm 11 reads overrides from this file, not package.json
overrides:
  handlebars: ^4.7.9
  lodash: ^4.17.21
  lodash-es: ^4.17.21
  # note: do not force glob@11 globally — test-exclude@6 (jest coverage)
  # still needs the glob@7 callback API (promisify(require('glob')))
  'minimatch@9': 9.0.9
  'minimatch@>=10': '>=10.0.1'
  esbuild: '>=0.28.1'
  rollup: ^4.40.2
  tar: '>=7.5.16'
  tmp: '>=0.2.6'
  flatted: ^3.4.2
  'js-yaml@3': 3.15.1
  'js-yaml@>=4': 4.3.1
  yaml: ^2.8.1
  'brace-expansion@1': 1.1.16
  'brace-expansion@2': 2.1.2
  'brace-expansion@5': 5.0.8
  diff: ^7.0.0
  '@babel/core': '>=7.29.6'
  ip-address: '>=10.3.1'
  picomatch: ^4.0.4
  # GHSA-7p8r-x3mc-p8w7: 4.1.1 is vulnerable. A loose ">=3.1.4" floor
  # previously resolved ajv's ^3 to 4.1.1; keep the 4.x line but patched.
  fast-uri: '>=4.1.2'
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.0.5'
  axios: '>=1.16.0'
  form-data: '>=4.0.6'
